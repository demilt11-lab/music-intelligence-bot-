name: Artist ETL

# Prevent overlapping runs of the same workflow (e.g. a manual
# workflow_dispatch firing while the scheduled run is still in flight),
# which could otherwise double-write the same rows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "30 8 * * *" # 8:30 UTC daily — after ingestion (≤7:00) and signal ETL (8:00)
  workflow_dispatch:

jobs:
  artist-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Run artist ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # add any other env vars
        run: npm run etl:artist-all
