name: ML Pipeline — Predictive A&R

on:
  schedule:
    # Runs daily at 10:00 UTC (after ETL jobs typically complete)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

jobs:
  ml-pipeline:
    name: Feature Engineering + Scoring
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ml/requirements.txt"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Resolve target date
        id: resolve_date
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run feature engineering
        env:
          TARGET_DATE: ${{ steps.resolve_date.outputs.date }}
        run: |
          python ml/ar_feature_engineering.py --date "$TARGET_DATE"

      - name: Run scoring (heat, stability, platform balance)
        env:
          TARGET_DATE: ${{ steps.resolve_date.outputs.date }}
        run: |
          python ml/scoring.py --date "$TARGET_DATE"

      - name: Run breakout probability scoring (skip if model missing)
        env:
          TARGET_DATE: ${{ steps.resolve_date.outputs.date }}
        run: |
          if [ -f ml/models/breakout_xgb.pkl ]; then
            python ml/score_breakout_daily.py --date "$TARGET_DATE"
          else
            echo "No trained model found at ml/models/breakout_xgb.pkl — skipping breakout scoring."
            echo "Run 'python ml/train_breakout.py' locally to train and commit the model."
          fi

      - name: Pipeline complete
        env:
          TARGET_DATE: ${{ steps.resolve_date.outputs.date }}
        run: echo "ML pipeline completed successfully for $TARGET_DATE"
