name: ETL — Compute Signals

on:
  schedule:
    - cron: "0 8 * * *" # 8:00 UTC daily — after ingestion jobs
  workflow_dispatch:

jobs:
  compute-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Compute track signals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}?pgbouncer=true&connection_limit=1
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx jobs/etl/compute_track_signals.ts

      - name: Compute artist signals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}?pgbouncer=true&connection_limit=1
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx jobs/etl/compute_artist_signals.ts

      - name: Build track trend labels
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}?pgbouncer=true&connection_limit=1
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx jobs/etl/track_trend_labels.ts $(date -u +%Y-%m-%d)
