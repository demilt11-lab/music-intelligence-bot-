name: Database Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Run Prisma migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to database
        run: |
          # Use session pooler (port 5432) instead of transaction pooler (port 6543)
          # Session pooler supports DDL/schema operations; transaction pooler hangs
          SESSION_URL=$(echo "$DATABASE_URL" | sed 's/:6543\//:5432\//')
          # Migration-history deploys (baseline squashed 2026-06-11).
          # Existing db-push-managed databases need a one-time:
          #   prisma migrate resolve --applied 20260611000000_baseline
          # NOTE (historical): --accept-data-loss intentionally removed; db push
          # applies additive changes automatically but ABORTS (non-zero exit) on
          # any destructive change (dropped column/table), forcing human review.
          # Never re-add --accept-data-loss to an automated production workflow.
          # Self-arming: records the squashed baseline on db-push-managed
          # databases (no-op on fresh or already-migrated ones).
          DATABASE_URL="$SESSION_URL" DIRECT_URL="$SESSION_URL" npx tsx scripts/ensure-baseline.ts
          DATABASE_URL="$SESSION_URL" DIRECT_URL="$SESSION_URL" npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
