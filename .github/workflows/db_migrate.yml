name: Database Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Run Prisma migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to database
        run: |
          # Use session pooler (port 5432) instead of transaction pooler (port 6543)
          # Session pooler supports DDL/schema operations; transaction pooler hangs
          SESSION_URL=$(echo "$DATABASE_URL" | sed 's/:6543\//:5432\//')
          DATABASE_URL="$SESSION_URL" DIRECT_URL="$SESSION_URL" npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
