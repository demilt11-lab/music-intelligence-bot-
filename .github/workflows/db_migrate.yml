name: Database Migrations

# Prevent overlapping runs of the same workflow (e.g. a manual
# workflow_dispatch firing while the scheduled run is still in flight),
# which could otherwise double-write the same rows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Run Prisma migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Prisma migrations need a direct (non-transaction-pooler) connection.
          # Rather than depend on a separately-maintained DIRECT_URL secret —
          # which has drifted to a stale Supabase project ref and fails with
          # "tenant/user not found" — derive it from the known-good DATABASE_URL:
          # switch the Supabase transaction pooler (port 6543) to the session
          # pooler (port 5432) and drop the pgbouncer query params. This keeps the
          # project ref + credentials in a single source of truth.
          DIRECT_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's#:6543/#:5432/#; s#\?.*$##')"
          echo "::add-mask::$DIRECT_URL"
          export DIRECT_URL
          npx prisma migrate deploy
