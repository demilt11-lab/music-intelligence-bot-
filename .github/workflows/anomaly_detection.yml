name: anomaly-detection

# Prevent overlapping runs of the same workflow (e.g. a manual
# workflow_dispatch firing while the scheduled run is still in flight),
# which could otherwise double-write the same rows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  detect:
    name: Detect anomalies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run anomaly detection
        run: npx tsx jobs/etl/anomaly_detection.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
