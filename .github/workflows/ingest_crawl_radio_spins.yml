name: Ingest Radio Station Spins

on:
  schedule:
    - cron: "45 6 * * *" # daily at 6:45am UTC
  workflow_dispatch:

jobs:
  ingest-crawl-radio-spins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run radio spins ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CRAWLER_API_URL: ${{ secrets.CRAWLER_API_URL }}
          CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
        run: npx tsx jobs/ingest/crawl_radio_spins.ts
