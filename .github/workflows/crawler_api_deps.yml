name: Crawler API deps (lxml override guard)

# Regression guard for the security override in services/crawler-api:
# crawl4ai caps `lxml~=5.3` (< 6.0), but the XXE fix (CVE-2026-41066) needs
# lxml >= 6.1.0, so it is force-upgraded via a second pip step
# (requirements-overrides.txt). This job proves the two-step install still
# resolves and that crawl4ai imports cleanly against lxml 6.x. Path-filtered so
# it only runs when the crawler-api dependency surface changes.

on:
  push:
    branches: [main]
    paths:
      - "services/crawler-api/requirements.txt"
      - "services/crawler-api/requirements-overrides.txt"
      - ".github/workflows/crawler_api_deps.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/crawler-api/requirements.txt"
      - "services/crawler-api/requirements-overrides.txt"
      - ".github/workflows/crawler_api_deps.yml"
  workflow_dispatch:

jobs:
  verify-lxml-override:
    name: crawler-api installs with lxml >= 6.1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/crawler-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/crawler-api/requirements.txt
            services/crawler-api/requirements-overrides.txt

      # Two separate invocations on purpose: crawl4ai's `lxml~=5.3` cap and
      # lxml>=6.1.0 only conflict inside a single resolution. The base install
      # pulls a 5.x lxml; the override step force-upgrades it.
      - name: Install base requirements
        run: pip install -r requirements.txt

      - name: Apply security overrides (force lxml >= 6.1.0 past crawl4ai's cap)
        run: pip install -r requirements-overrides.txt

      - name: Assert lxml >= 6.1 and crawl4ai imports against it
        run: |
          python - <<'PY'
          import importlib.metadata as md

          lxml_ver = md.version("lxml")
          major, minor = (int(p) for p in lxml_ver.split(".")[:2])
          assert (major, minor) >= (6, 1), f"FAIL: lxml {lxml_ver} < 6.1 — override not applied"

          # lxml's C extension must actually load at 6.x.
          import lxml.etree  # noqa: F401

          # The exact crawl4ai API surface services/crawler-api/main.py imports —
          # guards both "crawl4ai imports under lxml 6.x" and "the API is stable".
          from crawl4ai import (  # noqa: F401
              AsyncWebCrawler,
              BrowserConfig,
              CacheMode,
              CrawlerRunConfig,
          )
          from crawl4ai.extraction_strategy import JsonCssExtractionStrategy  # noqa: F401

          print(f"OK: lxml {lxml_ver} and crawl4ai {md.version('crawl4ai')} import cleanly together")
          PY
