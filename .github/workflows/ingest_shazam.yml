name: Ingest Shazam

# Prevent overlapping runs of the same workflow (e.g. a manual
# workflow_dispatch firing while the scheduled run is still in flight),
# which could otherwise double-write the same rows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */8 * * *" # every 8 hours
  workflow_dispatch:

jobs:
  ingest-shazam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Shazam ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SHAZAM_API_KEY: ${{ secrets.SHAZAM_API_KEY }}
          SHAZAM_BASE_URL: ${{ secrets.SHAZAM_BASE_URL }}
        run: npx tsx jobs/ingest/shazam.ts
