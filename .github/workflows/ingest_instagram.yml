name: Ingest Instagram Reels

on:
  schedule:
    - cron: "0 */10 * * *" # every 10 hours
  workflow_dispatch:

jobs:
  ingest-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Instagram Reels ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: npx ts-node --project tsconfig.json jobs/ingest/instagram.ts
