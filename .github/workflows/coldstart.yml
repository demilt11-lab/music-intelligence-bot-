name: Cold Start Ingestion

# Prevent overlapping runs of the same workflow (e.g. a manual
# workflow_dispatch firing while the scheduled run is still in flight),
# which could otherwise double-write the same rows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# One-button cold start: runs every configured provider ingest in dependency
# order, the full ETL chain, and the reconciliation gate. Providers without
# secrets are skipped loudly. Safe to re-run (idempotent jobs) — but it does
# run the full prod ingest+ETL chain against whatever DATABASE_URL points at,
# so it requires an explicit "apply" confirmation like db_seed.yml and
# cleanup_junk_tracks.yml, rather than firing on a bare workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually run the cold-start sequence (leave unchecked to no-op safely)"
        type: boolean
        default: false
      skip_ingest:
        description: "Skip Phase 1 ingestion (ETL + reconcile only)"
        type: boolean
        default: false

jobs:
  coldstart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        if: ${{ inputs.apply }}
        run: npm ci
      - name: Generate Prisma client
        if: ${{ inputs.apply }}
        run: npx prisma generate
      - name: Skipped (apply not checked)
        if: ${{ !inputs.apply }}
        run: |
          echo "::warning::Cold-start was skipped because 'apply' was not checked. This runs the full ingest+ETL chain against whatever DATABASE_URL points at (production) — re-run with 'apply' checked only if that's intended."
      - name: Set up Python for crawler service
        if: ${{ inputs.apply && !inputs.skip_ingest }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ingest:tiktok crawls TikTok Creative Center through the self-hosted
      # crawl4ai service — boot it inside this runner (skipped for ETL-only
      # runs). continue-on-error: a crawler boot failure must not abort the
      # whole cold start; the TikTok step will fail loudly on its own.
      - name: Start crawl4ai crawler service (in-runner)
        if: ${{ inputs.apply && !inputs.skip_ingest }}
        continue-on-error: true
        run: |
          pip install -q -r services/crawler-api/requirements.txt
          python -m playwright install --with-deps chromium
          (cd services/crawler-api && nohup uvicorn main:app --host 127.0.0.1 --port 8090 > /tmp/crawler.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/health > /dev/null; then
              echo "crawler service is up"; exit 0
            fi
            sleep 1
          done
          echo "crawler service failed to start:"; cat /tmp/crawler.log; exit 1

      - name: Run cold-start sequence
        if: ${{ inputs.apply }}
        run: bash scripts/coldstart.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          COLDSTART_SKIP_INGEST: ${{ inputs.skip_ingest && '1' || '0' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CRAWLER_API_URL: ${{ vars.CRAWLER_API_URL || 'http://127.0.0.1:8090' }}
          CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SHAZAM_API_KEY: ${{ secrets.SHAZAM_API_KEY }}
          SHAZAM_BASE_URL: ${{ secrets.SHAZAM_BASE_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CRAWLER_API_URL: ${{ secrets.CRAWLER_API_URL }}
          CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          # Repo secret is named META_SECRET; accept either name.
          META_APP_SECRET: ${{ secrets.META_APP_SECRET || secrets.META_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
