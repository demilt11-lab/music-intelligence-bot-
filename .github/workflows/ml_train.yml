name: ML Training Pipeline

# Prevent overlapping runs of the same workflow (e.g. a manual
# workflow_dispatch firing while the scheduled run is still in flight),
# which could otherwise double-write the same rows.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  # Triggered by ETL — Compute Signals finishing, rather than a fixed clock
  # time guessed to land after it. The previous schedule (07:00 UTC) ran
  # *before* etl_compute_signals (08:00 UTC) despite a comment claiming it
  # ran after a 04:00 UTC ETL step that doesn't exist in this repo — training
  # was running on the previous day's signals every single day.
  workflow_run:
    workflows: ["ETL — Compute Signals"]
    types: [completed]

jobs:
  train:
    name: Trigger in-process ML training on Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Train both models
        run: |
          BASE_URL="${VERCEL_URL#https://}"
          BASE_URL="${BASE_URL#http://}"
          BASE_URL="https://${BASE_URL%/}"
          echo "Triggering ML training on $BASE_URL ..."
          HTTP_STATUS=$(curl -sL -o /tmp/ml_response.json \
            -w "%{http_code}" \
            -X POST "$BASE_URL/api/internal/ml/train" \
            -H "Authorization: Bearer $INTERNAL_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP status: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/ml_response.json
          # Fail only on non-200 or if response contains an "error" field at the model level
          [ "$HTTP_STATUS" = "200" ] || (echo "Expected 200, got $HTTP_STATUS" && exit 1)
          grep -q '"error"' /tmp/ml_response.json && (echo "One or more models returned an error" && exit 1) || true
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          INTERNAL_ADMIN_SECRET: ${{ secrets.INTERNAL_ADMIN_SECRET }}

      - name: Check model status
        run: |
          BASE_URL="${VERCEL_URL#https://}"
          BASE_URL="${BASE_URL#http://}"
          BASE_URL="https://${BASE_URL%/}"
          curl -sL "$BASE_URL/api/internal/ml/status" \
            -H "Authorization: Bearer $INTERNAL_ADMIN_SECRET"
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          INTERNAL_ADMIN_SECRET: ${{ secrets.INTERNAL_ADMIN_SECRET }}
