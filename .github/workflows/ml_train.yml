name: ML Training Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (after ETL at 04:00 + Vercel cron at 06:00 as fallback)

jobs:
  train:
    name: Trigger in-process ML training on Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Train both models
        run: |
          # Strip any protocol prefix and trailing slash, then force https://
          BASE_URL="${VERCEL_URL#https://}"
          BASE_URL="${BASE_URL#http://}"
          BASE_URL="https://${BASE_URL%/}"
          echo "Triggering ML training on $BASE_URL ..."
          RESPONSE=$(curl -sLf -X POST "$BASE_URL/api/internal/ml/train" \
            -H "Authorization: Bearer $INTERNAL_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\nHTTP_STATUS:%{http_code}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || (echo "Training failed (HTTP $HTTP_STATUS)" && exit 1)
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          INTERNAL_ADMIN_SECRET: ${{ secrets.INTERNAL_ADMIN_SECRET }}

      - name: Check model status
        run: |
          BASE_URL="${VERCEL_URL#https://}"
          BASE_URL="${BASE_URL#http://}"
          BASE_URL="https://${BASE_URL%/}"
          curl -sLf "$BASE_URL/api/internal/ml/status" \
            -H "Authorization: Bearer $INTERNAL_ADMIN_SECRET"
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          INTERNAL_ADMIN_SECRET: ${{ secrets.INTERNAL_ADMIN_SECRET }}
