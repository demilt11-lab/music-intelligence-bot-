name: ML Training Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (after ETL at 04:00 + Vercel cron at 06:00 as fallback)

jobs:
  train:
    name: Trigger in-process ML training on Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Train both models
        run: |
          echo "Triggering ML training on $VERCEL_URL ..."
          RESPONSE=$(curl -sf -X POST "$VERCEL_URL/api/internal/ml/train" \
            -H "Authorization: Bearer $INTERNAL_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || (echo "Training failed" && exit 1)
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          INTERNAL_ADMIN_SECRET: ${{ secrets.INTERNAL_ADMIN_SECRET }}

      - name: Check model status
        run: |
          curl -sf "$VERCEL_URL/api/internal/ml/status" \
            -H "Authorization: Bearer $INTERNAL_ADMIN_SECRET"
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          INTERNAL_ADMIN_SECRET: ${{ secrets.INTERNAL_ADMIN_SECRET }}
