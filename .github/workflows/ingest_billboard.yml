name: Ingest Billboard Charts

on:
  schedule:
    - cron: "0 6 * * *" # daily at 6am UTC — before ETL at 8am
  workflow_dispatch:

jobs:
  ingest-billboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Billboard ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}?pgbouncer=true&connection_limit=1
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npx tsx jobs/ingest/billboard.ts
