name: QA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r ml/requirements.txt pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          python -m pytest ml/tests/unit/ \
            --cov=ml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q --timeout=60

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r ml/requirements.txt pytest pytest-cov

      - name: Run integration tests
        run: |
          python -m pytest ml/tests/integration/ \
            -q --timeout=120

  telemetry-tests:
    name: Telemetry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r ml/requirements.txt pytest

      - name: Run telemetry tests
        run: |
          python -m pytest ml/tests/test_telemetry.py \
            -q --timeout=60

  full-suite:
    name: Full ML Test Suite
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, telemetry-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r ml/requirements.txt pytest pytest-cov

      - name: Run full suite with coverage report
        run: |
          python -m pytest ml/tests/ \
            --cov=ml \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q --timeout=120

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
