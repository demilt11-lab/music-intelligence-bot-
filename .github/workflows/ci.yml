name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static validation: typecheck, lint, build, unit tests (no DB needed) ────
  validate:
    name: Typecheck · Lint · Build · Unit tests
    runs-on: ubuntu-latest
    env:
      # Prisma Client is instantiated at import time, so a (dummy) URL must exist
      # for `next build`. No real connection is made during the build.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?pgbouncer=true
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
      # Build-time placeholders so route modules that read these don't crash.
      CRON_SECRET: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck ETL jobs & scripts
        run: npm run typecheck:jobs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

      - name: Unit tests
        run: npm test

  # ── End-to-end smoke test against a real Postgres + running server ──────────
  smoke:
    name: Smoke (Postgres + live server)
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_intelligence
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/music_intelligence
      CRON_SECRET: ci-smoke-secret
      AUTH_SECRET: ci-smoke-auth-secret
      INTERNAL_ADMIN_SECRET: ci-smoke-internal-secret
      INTERNAL_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # NOTE: do NOT set NODE_ENV=production at the job level — it makes `npm ci`
      # skip devDependencies (tailwindcss, typescript, postcss…), which breaks
      # `next build`. `next build`/`next start` set production mode themselves.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to Postgres
        run: npx prisma migrate deploy

      - name: Build
        run: npx next build

      - name: Start server
        run: |
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/api/health; then
              echo "server ready"; exit 0
            fi
            sleep 2
          done
          echo "server failed to start"; cat /tmp/server.log; exit 1

      - name: Run smoke test
        run: npm run smoke

      - name: Run penetration test (attacks must be blocked)
        env:
          PENTEST_BASE_URL: http://localhost:3000
        run: npm run pentest

      - name: Server logs on failure
        if: failure()
        run: cat /tmp/server.log || true

  # ── ETL integration: seed + full pipeline chain against real Postgres ───────
  etl-integration:
    name: ETL pipeline integration
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etl_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etl_check
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/etl_check
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed demo pipeline data
        run: npx tsx prisma/seed.ts
      - name: Run ETL chain
        run: |
          DATE=$(date -u +%F)
          YESTERDAY=$(date -u -d "yesterday" +%F)
          npx tsx jobs/etl/artist_daily_stats.ts "$YESTERDAY"
          npx tsx jobs/etl/artist_trajectory_snapshots.ts "$DATE"
          npx tsx jobs/etl/ugcTracks.ts
          npx tsx jobs/etl/genres.ts
          npx tsx jobs/etl/track_trend_labels.ts "$DATE"
      - name: Reconciliation must pass
        run: npx tsx jobs/etl/reconcile.ts

  # ── Browser-driven E2E: renders real pages, exercises client-side JS ─────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_check
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/e2e_check
      CRON_SECRET: ci-e2e-secret
      AUTH_SECRET: ci-e2e-auth-secret
      INTERNAL_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to Postgres
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npx next build

      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Dependency security audit (production deps, high+) ──────────────────────
  security-audit:
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
