name: xgboost_baseline
type: xgboost

n_estimators: 500
max_depth: 6
learning_rate: 0.05
subsample: 0.8
colsample_bytree: 0.8
min_child_weight: 3
gamma: 0.1
reg_alpha: 0.1
reg_lambda: 1.0
scale_pos_weight: 11.5  # correct for 8% viral rate: (1-0.08)/0.08 ≈ 11.5
# Class imbalance: ~8% viral rate requires aggressive positive weighting
# Formula: (n_negative / n_positive) = (0.92 / 0.08) = 11.5
use_label_encoder: false
eval_metric: auc
early_stopping_rounds: 50
