name: xgboost_baseline
type: xgboost

n_estimators: 500
max_depth: 6
learning_rate: 0.05
subsample: 0.8
colsample_bytree: 0.8
min_child_weight: 3
gamma: 0.1
reg_alpha: 0.1
reg_lambda: 1.0
scale_pos_weight: 3.0  # handle class imbalance
use_label_encoder: false
eval_metric: auc
early_stopping_rounds: 50
